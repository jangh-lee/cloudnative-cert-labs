apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-latest
  namespace: kca23
  labels:
    lecture.kca/lab: kca23
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-latest
  template:
    metadata:
      labels:
        app: web-latest
    spec:
      containers:
        - name: web
          image: nginx:latest
