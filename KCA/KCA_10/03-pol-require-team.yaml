apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-team
  namespace: kca10-blue
  labels:
    lecture.kca/lab: kca10
spec:
  background: false
  rules:
    - name: team-label
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        failureAction: Enforce
        message: "team 라벨 필요"
        pattern:
          metadata:
            labels:
              team: "?*"
