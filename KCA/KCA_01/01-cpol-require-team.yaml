apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: kca01-require-team
  labels:
    lecture.kca/lab: kca01
spec:
  background: false
  rules:
    - name: team-label
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - kca01
      validate:
        failureAction: Enforce
        message: "kca01 Namespace의 Pod에는 team 라벨이 필요하다."
        pattern:
          metadata:
            labels:
              team: "?*"
