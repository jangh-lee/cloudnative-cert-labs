apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: kca11
  labels:
    lecture.kca/lab: kca11
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-creator
  namespace: kca11
  labels:
    lecture.kca/lab: kca11
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-pod-creator
  namespace: kca11
  labels:
    lecture.kca/lab: kca11
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: kca11
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-creator
